services:
  - type: web
    name: portfolio-manager
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Supabase -> Settings -> Database -> Connection pooling. Use the POOLER host
      # (aws-0-<region>.pooler.supabase.com), NOT the direct db.<ref>.supabase.co one:
      # Supabase serves the direct connection over IPv6 only, and Render has no IPv6
      # egress, so the direct URI works from a laptop and then times out in production.
      # Session mode (5432) is preferred for a long-lived container; transaction mode
      # (6543) also works and app/store/db.py adapts to it automatically.
      # Change the scheme to postgresql+psycopg:// -- Supabase hands you postgresql://.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Project Settings -> API -> JWT Secret. This verifies the token; it is not the
      # anon key and must never reach the browser.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Any long random string. The GitHub Actions cron presents it to POST /api/refresh.
      - key: REFRESH_TOKEN
        sync: false
      - key: PRICE_CACHE_TTL_MINUTES
        value: "15"
      # LLM analyst + hierarchical briefing. WITHOUT a key here, "Explore a stock" gets no
      # analyst read and the briefing falls back to deterministic output — the features look
      # broken in production even though they work locally (where .env supplies the key).
      # Gemini's free tier is the preferred provider; set the value in the Render dashboard,
      # never in the repo (sync: false means Render stores it, git never sees it).
      - key: GEMINI_API_KEY
        sync: false
      # Optional extra providers: Groq is the other free tier; Anthropic powers the premium
      # (Claude) tier. Leave unset to run on Gemini alone.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Explore fundamentals fallback. Yahoo's ratios endpoint (.info) is blocked from
      # Render's IP, so ratios are blank on the host. Finnhub's free tier is a keyed source
      # that works from cloud IPs — US-listed tickers only (NSE/BSE aren't on the free plan).
      # Get a free key at finnhub.io and set it here; leave unset to run on yfinance alone.
      - key: FINNHUB_API_KEY
        sync: false
